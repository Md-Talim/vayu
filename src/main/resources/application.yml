spring:
  application:
    name: vayu
  mvc:
    servlet:
      path: /api/v1
  datasource:
    url: jdbc:postgresql://localhost:5432/vayu
    username: vayu
    password: vayu
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  task:
    scheduling:
      pool:
        size: 2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: vayu

vayu:
  worker:
    enabled: true
    poll-interval: 100ms
    batch-size: 20
    concurrency: 16
    queue-capacity: 200
    max-batches-per-poll: 10
    connect-timeout: 2s
    read-timeout: 5s
    lease: 60s
    retry:
      base-delay: 2s
      max-delay: 5m
      multiplier: 2.0
    reaper:
      enabled: true
      interval: 30s
      batch-size: 50
